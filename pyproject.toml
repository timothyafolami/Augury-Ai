[project]
name = "augury"
version = "0.1.0"
description = "Reads the code, makes a falsifiable claim, runs the experiment."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "autogen-core==0.7.5",
    "autogen-ext[anthropic,openai]==0.7.5",
    "typer>=0.15",
    "rich>=13.9",
    "tree-sitter>=0.26.0",
    "tree-sitter-language-pack>=1.15.8",
    "pyyaml>=6.0.3",
    "ddgs>=9.16.0",
    "fastapi>=0.141.1",
    "uvicorn>=0.52.4",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.8", "mypy>=1.13"]
# What a case experiment needs to import the repository it measures. Separate
# from dev because a judge reproducing the measurements needs these and does
# not need the linters, and an extra rather than a dependency because the
# reviewer itself never imports any of them.
#
# `uv sync` installs no extras, so the Makefile targets ask for this one by
# name. Without that a clean clone replays every model call correctly and
# breaks every experiment.
experiments = [
    "sqlalchemy[asyncio]>=2.0.36",
    "aiosqlite>=0.20",
    "httpx>=0.27",
    "fastapi>=0.115",
    "asyncpg>=0.30",
]

[project.scripts]
augury = "augury.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/augury"]
artifacts = [
    "src/augury/prompts/**/*.md",
    # The lab extract. It is in every analyst prompt, so an installed copy
    # without it produces different prompts from a checkout with it, and every
    # recorded cassette misses.
    "src/augury/core/corpus/*.md",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
# Case repositories and test fixtures are inputs, not code we own. They
# contain deliberately seeded defects; linting them would fight the seeding.
extend-exclude = ["docs", ".venv", "eval/cases", "tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
strict = true
mypy_path = "src"
python_version = "3.12"
# Same reason as ruff's exclusion: these are inputs under review, not our code.
exclude = ["^eval/cases/", "^tests/fixtures/"]

[dependency-groups]
dev = [
    "types-pyyaml>=6.0.12.20260815",
]
