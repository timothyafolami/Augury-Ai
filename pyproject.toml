[project]
name = "augury"
version = "0.1.0"
description = "Reads the code, makes a falsifiable claim, runs the experiment."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "autogen-core==0.7.5",
    "autogen-ext[anthropic,openai]==0.7.5",
    "typer>=0.15",
    "rich>=13.9",
    "tree-sitter>=0.26.0",
    "tree-sitter-language-pack>=1.15.8",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.8", "mypy>=1.13"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/augury"]
artifacts = ["src/augury/prompts/**/*.md"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
# Case repositories and test fixtures are inputs, not code we own. They
# contain deliberately seeded defects; linting them would fight the seeding.
extend-exclude = ["docs", ".venv", "eval/cases", "tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
strict = true
mypy_path = "src"
python_version = "3.12"
# Same reason as ruff's exclusion: these are inputs under review, not our code.
exclude = ["^eval/cases/", "^tests/fixtures/"]
